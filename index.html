<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>Mesto</title>
  <script type="module" crossorigin src="./assets/index-BogUrZ1F.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DNbS4tJ4.css">
</head>
<body class="page">
  <div class="page__content">
    <header class="header page__section">
      <img class="header__logo" src="./assets/logo-C_QQpFK1.svg" alt="Логотип Mesto">
    </header>

    <main class="content page__section">
      <section class="profile">
        <div class="profile__image-container">
          <img class="profile__image" src="" alt="Аватар пользователя">
          <button class="profile__image-overlay" type="button" aria-label="Редактировать аватар"></button>
        </div>
        <h1 class="profile__title"></h1>
        <button class="profile__edit-button" type="button" aria-label="Редактировать профиль"></button>
        <p class="profile__description"></p>
        <button class="profile__add-button" type="button" aria-label="Добавить место"></button>
      </section>

      <section class="elements">
        <ul class="places__list"></ul>
      </section>
    </main>

    <footer class="footer page__section">
      <p class="footer__copyright">© 2025 Mesto Russia</p>
    </footer>
  </div>

  <div class="popup popup_type_edit">
    <div class="popup__container">
      <button class="popup__close" type="button" aria-label="Закрыть"></button>
      <h2 class="popup__title">Редактировать профиль</h2>
      <form class="popup__form" name="edit-profile" novalidate>
        <input class="popup__input popup__input_type_name" id="input-name" type="text" name="name" placeholder="Имя" required minlength="2" maxlength="40" pattern="[a-zA-Zа-яА-ЯёЁ\s-]+">
        <span class="popup__error input-name-error"></span>
        <input class="popup__input popup__input_type_description" id="input-description" type="text" name="description" placeholder="Занятие" required minlength="2" maxlength="200">
        <span class="popup__error input-description-error"></span>
        <button class="popup__button popup__button_disabled" type="submit" disabled>Сохранить</button>
      </form>
    </div>
  </div>

  <div class="popup popup_type_new-card">
    <div class="popup__container">
      <button class="popup__close" type="button" aria-label="Закрыть"></button>
      <h2 class="popup__title">Новое место</h2>
      <form class="popup__form" name="add-place" novalidate>
        <input class="popup__input popup__input_type_card-name" id="input-place-name" type="text" name="place-name" placeholder="Название" required minlength="2" maxlength="30" pattern="[a-zA-Zа-яА-ЯёЁ\s-]+">
        <span class="popup__error input-place-name-error"></span>
        <input class="popup__input popup__input_type_url" id="input-url" type="url" name="url" placeholder="Ссылка на картинку" required>
        <span class="popup__error input-url-error"></span>
        <button class="popup__button popup__button_disabled" type="submit" disabled>Создать</button>
      </form>
    </div>
  </div>

  <div class="popup popup_type_image">
    <div class="popup__container popup__container_type_image">
      <button class="popup__close" type="button" aria-label="Закрыть"></button>
      <img class="popup__image" src="" alt="">
      <p class="popup__caption"></p>
    </div>
  </div>

  <div class="popup popup_type_edit-avatar">
    <div class="popup__container">
      <button class="popup__close" type="button" aria-label="Закрыть"></button>
      <h2 class="popup__title">Обновить аватар</h2>
      <form class="popup__form" name="edit-avatar" novalidate>
        <input class="popup__input popup__input_type_avatar" id="input-avatar" type="url" name="avatar" placeholder="Ссылка на аватар" required>
        <span class="popup__error input-avatar-error"></span>
        <button class="popup__button popup__button_disabled" type="submit" disabled>Сохранить</button>
      </form>
    </div>
  </div>

  <div class="popup popup_type_remove-card">
    <div class="popup__container">
      <button class="popup__close" type="button" aria-label="Закрыть"></button>
      <h2 class="popup__title">Вы уверены?</h2>
      <p class="popup__description">Это действие нельзя отменить</p>
      <div class="popup__buttons">
        <button class="popup__button popup__button_type_confirm" type="button">Да</button>
        <button class="popup__button popup__button_type_cancel" type="button">Нет</button>
      </div>
    </div>
  </div>

  <div class="popup popup_type_info">
    <div class="popup__container">
      <button class="popup__close" type="button" aria-label="Закрыть"></button>
      <h2 class="popup__title">Статистика</h2>
      <ul class="popup__info-list"></ul>
    </div>
  </div>

  <template id="card-template">
    <li class="places__item">
      <div class="card">
        <button class="card__control-button card__control-button_type_delete" type="button" aria-label="Удалить"></button>
        <img class="card__image" src="" alt="">
        <div class="card__info">
          <h3 class="card__title"></h3>
          <div class="card__like-container">
            <button class="card__like-button" type="button" aria-label="Лайк"></button>
            <span class="card__like-count"></span>
          </div>
        </div>
      </div>
    </li>
  </template>

  <template id="popup-info-definition-template">
    <li class="popup__info-item"></li>
  </template>

</body>
</html>
